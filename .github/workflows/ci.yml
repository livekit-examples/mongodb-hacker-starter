name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm format:check
      - run: pnpm build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck db scripts
        run: pnpm exec tsc -p db --noEmit

  agent-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-ts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: agent-ts/.nvmrc
          cache: pnpm
          cache-dependency-path: agent-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      # The agent runs its TypeScript directly (Node type stripping); start the
      # worker against an unreachable server to check it loads, with no
      # deprecation warnings.
      - name: Smoke test worker start
        run: |
          node src/main.ts --help
          timeout 15 node src/main.ts start --url ws://127.0.0.1:9 --api-key ci --api-secret ci-secret-ci-secret-ci-secret-ci > start.log 2>&1 || true
          tail -n 20 start.log
          grep -q "starting worker" start.log
          ! grep -qi "deprecat" start.log

  agent-py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-py
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: agent-py/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      # `python -m livekit.agents start` is what `lk agent start` and the Docker
      # image run; start the worker against an unreachable server to check the
      # agent loads, with no deprecation warnings.
      - name: Smoke test worker start
        env:
          PYTHONWARNINGS: default
        run: |
          timeout 15 uv run -m livekit.agents start src/agent.py --url ws://127.0.0.1:9 --api-key ci --api-secret ci-secret-ci-secret-ci-secret-ci > start.log 2>&1 || true
          tail -n 20 start.log
          grep -q "starting worker" start.log
          ! grep -qi "deprecat" start.log

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [agent-py, agent-ts]
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.agent }} image
        run: docker build -t ${{ matrix.agent }}:ci ${{ matrix.agent }}
